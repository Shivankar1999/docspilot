<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget demo · DocsPilot</title>
    <style>
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
      main { max-width: 640px; margin: 0 auto; padding: 64px 24px; }
      code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Example Store</h1>
      <p>A stand-in customer website for trying the DocsPilot widget locally.</p>
      <p>
        Open <code>/widget-demo.html?key=pk_...</code> with your public key, after adding
        <code>localhost:3000</code> to your allowed domains in Settings. Then click the chat bubble.
      </p>
    </main>
    <script>
      // Injects the real one-line snippet with the key from the URL.
      var key = new URLSearchParams(location.search).get('key');
      if (key) {
        var s = document.createElement('script');
        s.src = '/widget.js';
        s.setAttribute('data-key', key);
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
